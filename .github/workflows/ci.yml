name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Pango if missing
        if: runner.os == 'Linux'
        run: |
          if ! dpkg-query -W libpangocairo-1.0-0 > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libpangocairo-1.0-0
          fi
      - run: go mod download
      - run: go vet ./...
      - run: go test -shuffle=on ./...
      - run: go generate ./
      - name: Check generated collections
        run: >-
          git diff --exit-code -- sources lucide twemoji
          examples/native/catalog_gen.go
      - run: go run ./cmd/catalog -check
      - name: Check module metadata
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Test for data races
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -shuffle=on ./...
      - name: Build for browsers
        if: runner.os == 'Linux'
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./...
      - name: Render a real native window
        if: runner.os == 'macOS'
        run: go run ./examples/native -capture "$RUNNER_TEMP/browser.png"

  latest-mygo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Pango if missing
        run: |
          if ! dpkg-query -W libpangocairo-1.0-0 > /dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libpangocairo-1.0-0
          fi
      - name: Test latest stable MyGo in a disposable copy
        run: |
          cp -R . "$RUNNER_TEMP/latest-mygo"
          cd "$RUNNER_TEMP/latest-mygo"
          go get github.com/egoist/mygo@latest
          go list -m github.com/egoist/mygo
          go vet ./...
          go test -shuffle=on ./...
          GOOS=js GOARCH=wasm go build ./...

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify public module and pinned generator from another module
        env:
          ICONS_VERSION: ${{ github.sha }}
        run: go run ./cmd/verify-consumer -version "$ICONS_VERSION"
